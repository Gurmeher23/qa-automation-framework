# Production-like "stage": the same image that would be deployed, backed by PostgreSQL.
# Usage: cp .env.example .env && make stage-up && make stage-test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: orderdesk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://orderdesk:${POSTGRES_PASSWORD}@db:5432/orderdesk
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    ports:
      - "8000:8000"

volumes:
  pgdata:
